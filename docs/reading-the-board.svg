<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="cb" width="56" height="56" patternUnits="userSpaceOnUse" x="340" y="70">
      <rect width="56" height="56" fill="#EEEED2"/>
      <rect x="28" width="28" height="28" fill="#769656"/>
      <rect y="28" width="28" height="28" fill="#769656"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4287F5"/>
    </marker>
  </defs>
  <style>
    .h { font-size: 14px; font-weight: 700; fill: #E8E8EE; }
    .n { font-size: 14px; font-weight: 700; fill: #4287F5; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #A8A8B8; }
    .fen { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #C9C9D6; }
    .pc { font-size: 22px; text-anchor: middle; }
    .w { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 0.9; }
    .b { fill: #222222; }
    .note { font-size: 12px; fill: #8C8CA0; }
    .lab { font-size: 11px; fill: #8C8CA0; text-anchor: middle; }
  </style>

  <rect width="900" height="430" rx="16" fill="#0F0F14"/>

  <!-- column headers -->
  <text x="24" y="44"><tspan class="n">1</tspan><tspan class="h" dx="8">Piece classes on the page</tspan></text>
  <text x="340" y="44"><tspan class="n">2</tspan><tspan class="h" dx="8">Board rebuilt from them</tspan></text>
  <text x="604" y="44"><tspan class="n">3</tspan><tspan class="h" dx="8">FEN sent to Stockfish</tspan></text>

  <!-- 1: markup -->
  <text class="code" x="24" y="100">&lt;div class="piece wr square-11"&gt;</text>
  <text class="code" x="24" y="126">&lt;div class="piece wp square-54"&gt;</text>
  <rect x="18" y="135" width="272" height="24" rx="5" fill="#4287F5" fill-opacity="0.18" stroke="#4287F5" stroke-opacity="0.6"/>
  <text class="code" x="24" y="152" style="fill:#FFFFFF">&lt;div class="piece wn square-63"&gt;</text>
  <text class="code" x="24" y="178">&lt;div class="piece bp square-55"&gt;</text>
  <text class="code" x="24" y="204">&lt;div class="piece bk square-58"&gt;</text>
  <text class="code" x="24" y="230">  … one element per piece</text>
  <text class="note" x="24" y="272">wn = white knight</text>
  <text class="note" x="24" y="290">square-63 = file 6, rank 3 = f3</text>
  <text class="note" x="24" y="326">Chess.com renders the move list as</text>
  <text class="note" x="24" y="344">icons, figurines, or letters depending</text>
  <text class="note" x="24" y="362">on settings. These class names don't</text>
  <text class="note" x="24" y="380">change, so they're read first.</text>

  <!-- 2: board -->
  <rect x="340" y="70" width="224" height="224" fill="url(#cb)"/>
  <rect x="480" y="210" width="28" height="28" fill="#F6F669" fill-opacity="0.75"/>
  <!-- rank 8 -->
  <text class="pc b" x="354" y="91">♜</text><text class="pc b" x="382" y="91">♞</text><text class="pc b" x="410" y="91">♝</text><text class="pc b" x="438" y="91">♛</text><text class="pc b" x="466" y="91">♚</text><text class="pc b" x="494" y="91">♝</text><text class="pc b" x="522" y="91">♞</text><text class="pc b" x="550" y="91">♜</text>
  <!-- rank 7 -->
  <text class="pc b" x="354" y="119">♟︎</text><text class="pc b" x="382" y="119">♟︎</text><text class="pc b" x="410" y="119">♟︎</text><text class="pc b" x="438" y="119">♟︎</text><text class="pc b" x="494" y="119">♟︎</text><text class="pc b" x="522" y="119">♟︎</text><text class="pc b" x="550" y="119">♟︎</text>
  <!-- rank 5 / 4 -->
  <text class="pc b" x="466" y="175">♟︎</text>
  <text class="pc w" x="466" y="203">♟︎</text>
  <!-- rank 3 -->
  <text class="pc w" x="494" y="231">♞</text>
  <!-- rank 2 -->
  <text class="pc w" x="354" y="259">♟︎</text><text class="pc w" x="382" y="259">♟︎</text><text class="pc w" x="410" y="259">♟︎</text><text class="pc w" x="438" y="259">♟︎</text><text class="pc w" x="494" y="259">♟︎</text><text class="pc w" x="522" y="259">♟︎</text><text class="pc w" x="550" y="259">♟︎</text>
  <!-- rank 1 -->
  <text class="pc w" x="354" y="287">♜</text><text class="pc w" x="382" y="287">♞</text><text class="pc w" x="410" y="287">♝</text><text class="pc w" x="438" y="287">♛</text><text class="pc w" x="466" y="287">♚</text><text class="pc w" x="494" y="287">♝</text><text class="pc w" x="550" y="287">♜</text>
  <!-- file labels -->
  <text class="lab" x="354" y="312">a</text><text class="lab" x="382" y="312">b</text><text class="lab" x="410" y="312">c</text><text class="lab" x="438" y="312">d</text><text class="lab" x="466" y="312">e</text><text class="lab" x="494" y="312">f</text><text class="lab" x="522" y="312">g</text><text class="lab" x="550" y="312">h</text>
  <text class="note" x="340" y="344">After 1. e4 e5 2. Nf3</text>

  <!-- arrow: markup -> f3 -->
  <path d="M292,147 C390,150 420,222 476,224" fill="none" stroke="#4287F5" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3: FEN ranks, aligned with board rows -->
  <text class="fen" x="604" y="90">rnbqkbnr /</text>
  <text class="fen" x="604" y="118">pppp1ppp /</text>
  <text class="fen" x="604" y="146">8 /</text>
  <text class="fen" x="604" y="174">4p3 /</text>
  <text class="fen" x="604" y="202">4P3 /</text>
  <rect x="598" y="211" width="52" height="24" rx="5" fill="#4287F5" fill-opacity="0.18" stroke="#4287F5" stroke-opacity="0.6"/>
  <text class="fen" x="604" y="230" style="fill:#FFFFFF">5N2</text><text class="fen" x="654" y="230">/</text>
  <text class="fen" x="604" y="258">PPPP1PPP /</text>
  <text class="fen" x="604" y="286">RNBQKB1R</text>
  <!-- arrow: board row -> FEN -->
  <path d="M568,224 L594,224" fill="none" stroke="#4287F5" stroke-width="2" marker-end="url(#ah)"/>

  <text class="fen" x="604" y="330" style="fill:#FFFFFF" xml:space="preserve">b  KQkq  -  0  2</text>
  <text class="note" y="356"><tspan x="604" style="fill:#C9C9D6">b</tspan><tspan x="646">3 moves in the list, so Black to move</tspan></text>
  <text class="note" y="374"><tspan x="604" style="fill:#C9C9D6">KQkq</tspan><tspan x="646">kings and rooks on home squares</tspan></text>
  <text class="note" y="392"><tspan x="604" style="fill:#C9C9D6">- 0</tspan><tspan x="646">en passant and 50-move clock not tracked</tspan></text>
</svg>
